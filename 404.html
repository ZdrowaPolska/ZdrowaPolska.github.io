<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redirecting…</title>
  <script>
    (function () {
      var newOrigin = 'https://zdrowa-polska.github.io';
      var legacyPrefix = '/zdrowa-polska-signatures';
      var path = window.location.pathname || '/';

      if (path.indexOf(legacyPrefix) !== 0) {
        path = legacyPrefix + '/';
      }

      window.location.replace(
        newOrigin + path + window.location.search + window.location.hash
      );
    })();
  </script>
</head>
<body>
  <p>Redirecting to the current Zdrowa Polska page…</p>
  <p><a href="https://zdrowa-polska.github.io/zdrowa-polska-signatures/">Continue</a></p>
</body>
</html>
